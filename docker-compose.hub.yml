x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    # Tags: v1 (CPU), v1-cu128 (GPU).
    image: ${IMAGE_API:-uavforaliens/treecrown-workstation:v1-cu128}
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      # Postgres runs outside this stack; there is no db service here.
      TCP_DB_HOST: ${TCP_DB_HOST:?Set TCP_DB_HOST in .env to the Postgres server}
      TCP_DB_PORT: ${TCP_DB_PORT:-5432}
    working_dir: /code
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      # UI, API and Airflow callbacks share this port.
      - "${DRONE_API_PORT:-8200}:8000"
    volumes:
      - ./code:/code
      - ./frontend:/frontend
      - ./data:/data
      - ./starred:/starred:ro   # hand-picked gallery runs, see starred/README.md
      - ${HOST_MODELS_DIR:?Set HOST_MODELS_DIR in .env to the detector weights folder}:/models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]           # expose all host NVIDIA GPUs to the container
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/livez"]
      interval: 30s
      timeout: 5s
      retries: 3

  filebrowser:
    image: filebrowser/filebrowser
    ports:
      - "8098:80"
    volumes:
      - ./data/storage/projects:/srv
      - filebrowser_db:/database
    restart: unless-stopped
    logging: *default-logging

volumes:
  filebrowser_db:
