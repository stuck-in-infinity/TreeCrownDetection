x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ${IMAGE_API:-uavforaliens/treecrown-workstation:cu128}
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    working_dir: /code
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8123:8000"
    volumes:
      - ./code:/code
      - ./data:/data
      - ${HOST_MODELS_DIR:?Set HOST_MODELS_DIR in .env to the detector weights folder}:/models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]           # expose all host NVIDIA GPUs to the container
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/livez"]
      interval: 30s
      timeout: 5s
      retries: 3

  filebrowser:
    image: filebrowser/filebrowser
    ports:
      - "8098:80"
    volumes:
      - ./data/storage/projects:/srv
      - filebrowser_db:/database
    restart: unless-stopped
    logging: *default-logging

  frontend:
    image: ${IMAGE_FRONTEND:-uavforaliens/treecrown-frontend:latest}
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8200:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./data/logs/nginx:/var/log/nginx
    depends_on:
      - api
volumes:
  filebrowser_db: