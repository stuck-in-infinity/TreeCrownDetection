x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    # Opt-in, so `docker compose up` still works unchanged on SQLite.
    #   docker compose --profile postgres up -d
    profiles: ["postgres"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${TCP_DB_NAME:-treecrown}
      POSTGRES_USER: ${TCP_DB_USER:-treecrown}
      # No `:?` guard: compose interpolates every service before filtering by
      # profile, so a required-variable error would break plain
      # `docker compose up` on the SQLite setup. Postgres reports it instead.
      POSTGRES_PASSWORD: ${TCP_DB_PASSWORD:-}
      # locale=C matches SQLite's byte ordering, so `ORDER BY Ortho.stem`
      # (api/v1/projects.py) returns the same order on both backends. Only
      # settable at initdb; changing it later means recreating the volume.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:`: only the api needs 5432, over the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TCP_DB_USER:-treecrown} -d ${TCP_DB_NAME:-treecrown}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # pg_isready goes green during initdb, before the listener accepts
      # connections, so the api also retries (db/session.py wait_for_db).
      start_period: 30s

  api:
    # v1 = CPU build, v1-cu128 = GPU build. Also serves the web UI at "/".
    image: ${IMAGE_API:-uavforaliens/treecrown-workstation:v1-cu128}
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      # Set here, not in .env: `env_file:` passes values literally, so ${VAR}
      # inside .env arrives as those characters.
      TCP_DB_HOST: db
      TCP_DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
        # Not required, so the api still starts with the profile off.
        required: false
    working_dir: /code
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      # One host port for the UI and the API alike (DRONE_API_PORT in .env).
      - "${DRONE_API_PORT:-8200}:8000"
    volumes:
      - ./code:/code
      - ./frontend:/frontend
      - ./data:/data
      - ${HOST_MODELS_DIR:?Set HOST_MODELS_DIR in .env to the detector weights folder}:/models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]           # expose all host NVIDIA GPUs to the container
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/livez"]
      interval: 30s
      timeout: 5s
      retries: 3

  filebrowser:
    image: filebrowser/filebrowser
    ports:
      - "8098:80"
    volumes:
      - ./data/storage/projects:/srv
      - filebrowser_db:/database
    restart: unless-stopped
    logging: *default-logging

volumes:
  filebrowser_db:
  # Named volume, not a bind mount under ./data.
  pgdata: