# ════════════════════════════════════════════════════════════════════════
# Tree-Crown backend — workstation bundle
#
#   api       FastAPI backend. Baked venv in the image; code/data are
#             bind-mounted. Detector weights are mounted from HOST_MODELS_DIR.
#             Listens on 8000 in the container, published to the
#             host as 8123 (the port a remote/local Airflow uses to call back).
#   frontend  Simple static UI (nginx) on host port 8200.
#
# Airflow is NOT part of this bundle — it runs wherever the operator hosts it.
# Both URLs are configurable in .env:
#   TCP_AIRFLOW_BASE_URL  our backend -> Airflow REST (to start a DAG)
#   (DAG side) DRONE_API_BASE  Airflow DAG -> our backend (default :8123)
# ════════════════════════════════════════════════════════════════════════

# Docker's json-file driver keeps every line a container has ever written, with
# no ceiling, until the disk fills. Capping it here bounds each service at
# 30 MB of container log. The api also writes its own rotated app.log and
# errors.jsonl under /data/logs, which is the copy to read for an audit; this is
# the safety net for `docker compose logs`.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    # Opt-in, so `docker compose up` still works unchanged on SQLite.
    #   docker compose --profile postgres up -d
    profiles: ["postgres"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${TCP_DB_NAME:-treecrown}
      POSTGRES_USER: ${TCP_DB_USER:-treecrown}
      # No `:?` guard: compose interpolates every service before filtering by
      # profile, so a required-variable error would break plain
      # `docker compose up` on the SQLite setup. Postgres reports it instead.
      POSTGRES_PASSWORD: ${TCP_DB_PASSWORD:-}
      # locale=C matches SQLite's byte ordering, so `ORDER BY Ortho.stem`
      # (api/v1/projects.py) returns the same order on both backends. Only
      # settable at initdb; changing it later means recreating the volume.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:`: only the api needs 5432, over the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TCP_DB_USER:-treecrown} -d ${TCP_DB_NAME:-treecrown}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # pg_isready goes green during initdb, before the listener accepts
      # connections, so the api also retries (db/session.py wait_for_db).
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_INDEX: "${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}"
    image: ${IMAGE_API:-uavforaliens/treecrown-workstation:cu128}
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      # Set here, not in .env: `env_file:` passes values literally, so ${VAR}
      # inside .env arrives as those characters.
      TCP_DB_HOST: db
      TCP_DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
        # Not required, so the api still starts with the profile off.
        required: false
    working_dir: /code
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      # Host port from .env (TCP_API_PORT), container port fixed at 8000.
      # It was "8123:8000" hardcoded, which meant changing it required editing
      # this file — and this file is committed, so the change followed every
      # deployment around.
      - "${TCP_API_PORT:-8123}:8000"
    volumes:
      - ./code:/code              # backend code (mounted, not baked)
      - ./data:/data              # storage + sqlite DB (empty initially)
      - ${HOST_MODELS_DIR:?Set HOST_MODELS_DIR in .env to the detector weights folder}:/models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach a host-local Airflow
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]           # expose all host NVIDIA GPUs to the container
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/livez"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ${IMAGE_FRONTEND:-uavforaliens/treecrown-frontend:latest}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${TCP_FRONTEND_PORT:-8200}:80"    # open http://localhost:<that port>
    volumes:
      - ./frontend:/usr/share/nginx/html
      # Keep the access and error logs on the host. Without this they live in
      # the container's writable layer and go when it is replaced, which is
      # every deploy.
      - ./data/logs/nginx:/var/log/nginx
      # Our nginx config (logging + the /api/ proxy), mounted over the copy in
      # the image so a config change does not wait for a rebuild.
      - ./docker/nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  # Named volume, not a bind mount under ./data.
  pgdata:
