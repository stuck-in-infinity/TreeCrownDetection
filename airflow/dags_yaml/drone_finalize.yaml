# drone_finalize: calls POST /api/v1/compute/finalize on the backend.
# Setup: see README.md in this folder. Loaded by load_drone_dags.py.
drone_finalize:
  description: Drone species assignment + validation + KMZ export (single node)
  schedule_interval: null
  catchup: false
  max_active_runs: 4
  tags: [drone, tree-crown, finalize]
  params:
    project_id: ""
    run: 1
  default_args:
    owner: drone
    depends_on_past: false
    start_date: 2026-01-01
    retries: 1
    retry_delay_sec: 120
  tasks:
    execute_drone_finalize:
      operator: airflow.providers.http.operators.http.HttpOperator
      http_conn_id: drone_api
      endpoint: /api/v1/compute/finalize
      method: POST
      # Lower-case key: "Content-Type" makes dag-factory skip templating data.
      headers:
        content-type: application/json
        Idempotency-Key: "{{ run_id }}"
        X-Service-Token: "{{ var.value.get('drone_service_token', '') }}"
      data: >-
        {"execution_id": "{{ run_id }}:{{ ti.try_number }}",
        "project_id": {{ (dag_run.conf.get('project_id') or params.project_id) | tojson }},
        "run": {{ dag_run.conf.get('run', params.run) | tojson }}}
      extra_options:
        timeout: 7200
      execution_timeout_secs: 7300
      log_response: true
