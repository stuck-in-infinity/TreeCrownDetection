# nginx server for the static frontend, and the browser's way in to the API.
#
# Logging. Out of the box the image symlinks access.log and error.log to the
# container's stdout/stderr, which means the access record lives only as long
# as the container — replace the frontend and every trace of who opened what is
# gone. Here each log is written twice: once to /var/log/nginx, which compose
# bind-mounts to ./data/logs/nginx on the host so it survives the container, and
# once to stdout/stderr so `docker compose logs frontend` still shows something.
#
# These directives sit in the server block on purpose. The image's nginx.conf
# already sets access_log at http level; a second one at that level would write
# every line twice into the same file, whereas a server-level directive replaces
# what the server would otherwise inherit.
#
# API proxy. /api/ is passed through to the api service, so the page and the
# API share one origin and one port, and config.js sets window.API_BASE = "".
# Some networks let a browser reach only the frontend's port; without this the
# page loads but every API call has to reach :8123 directly and never arrives.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    access_log  /var/log/nginx/access.log  main;
    access_log  /dev/stdout               main;
    error_log   /var/log/nginx/error.log  warn;
    error_log   /dev/stderr               warn;

    # no-cache makes the browser revalidate index.html and config.js on every
    # load (a cheap 304 when nothing changed). Without it a browser can keep
    # running an old config.js, pointing at the wrong API, for hours after the
    # file was changed.
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        add_header Cache-Control "no-cache";
    }

    # The upstream is resolved through Docker's DNS per request (resolver plus a
    # variable) rather than once at start-up, so recreating the api container,
    # which gives it a new IP, does not leave nginx pointing at the old one.
    # With a variable and no URI part, proxy_pass forwards the request URI
    # unchanged, which is right: the API's own prefix is /api/v1.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        # $http_host, not $host: $host drops the port, and the API builds some
        # absolute URLs (crown thumbnails) from the Host it receives, so with
        # $host they pointed at port 80 instead of the port the page is on.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Orthomosaic uploads run to gigabytes. The API enforces its own cap
        # (TCP_MAX_UPLOAD_MB) and per-project quota, so nginx sets none, and
        # streams the body through rather than spooling it to disk first.
        client_max_body_size    0;
        proxy_request_buffering off;

        # One transfer may take up to TCP_ORTHO_TRANSFER_TIMEOUT_MIN (45 min by
        # default), and a Drive fetch holds its request open for all of it.
        # Keep these above that budget.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
