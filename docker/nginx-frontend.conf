# nginx server for the static frontend.
#
# The only reason this file exists is the logging. Out of the box the image
# symlinks access.log and error.log to the container's stdout/stderr, which
# means the access record lives only as long as the container — replace the
# frontend and every trace of who opened what is gone. Here each log is written
# twice: once to /var/log/nginx, which compose bind-mounts to ./data/logs/nginx
# on the host so it survives the container, and once to stdout/stderr so
# `docker compose logs frontend` still shows something.
#
# These directives sit in the server block on purpose. The image's nginx.conf
# already sets access_log at http level; a second one at that level would write
# every line twice into the same file, whereas a server-level directive replaces
# what the server would otherwise inherit.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    access_log  /var/log/nginx/access.log  main;
    access_log  /dev/stdout               main;
    error_log   /var/log/nginx/error.log  warn;
    error_log   /dev/stderr               warn;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
